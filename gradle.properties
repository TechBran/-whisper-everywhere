# Project-wide Gradle settings.
#
# (4.2 F8) -Xmx2048m -> -Xmx8192m, and the reason is one task: signReleaseBundle. AGP runs
# FinalizeBundleTask in an in-process Gradle worker, so it signs inside the daemon's own heap,
# and this branch's bundle is 5.99 GB (the four device-group variants of both NPU asset packs
# all live in the AAB — Play picks one per device at delivery, but the artifact carries them
# all). At 2 GB the task died with `java.lang.OutOfMemoryError: Java heap space` AFTER
# packageReleaseBundle had successfully produced the unsigned bundle — i.e. the failure is
# purely the signer's, and no smaller lever exists: an in-process worker has no separate heap
# setting. 8 GB on a 32 GB machine leaves the everyday builds untouched in behaviour (the JVM
# commits what it uses) and is what makes a signed AAB reachable at all.
org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.caching=false
org.gradle.configuration-cache=false

# Android settings
android.useAndroidX=true
android.nonTransitiveRClass=true

# Disable core library desugaring JDK image (workaround for jlink issue)
android.enableCoreLibraryDesugaring=false

# Disable R8 full mode to avoid transform issues
android.enableR8.fullMode=false

# Kotlin settings
kotlin.code.style=official

# Play device targeting for asset packs (4.2 F4): without this flag the bundle{} block's
# deviceTargetingConfig property does not exist and device_targeting_config.xml never enters
# the AAB. Experimental in name; the research verified the mechanism live (AGP >= 8.10 needed,
# this repo is on 8.13.2), and NpuPackLayoutTest pins this line so it cannot be dropped silently.
android.experimental.enableDeviceTargetingConfigApi=true
