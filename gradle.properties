# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.caching=false
org.gradle.configuration-cache=false

# Android settings
android.useAndroidX=true
android.nonTransitiveRClass=true

# Disable core library desugaring JDK image (workaround for jlink issue)
android.enableCoreLibraryDesugaring=false

# Disable R8 full mode to avoid transform issues
android.enableR8.fullMode=false

# Kotlin settings
kotlin.code.style=official

# Play device targeting for asset packs (4.2 F4): without this flag the bundle{} block's
# deviceTargetingConfig property does not exist and device_targeting_config.xml never enters
# the AAB. Experimental in name; the research verified the mechanism live (AGP >= 8.10 needed,
# this repo is on 8.13.2), and NpuPackLayoutTest pins this line so it cannot be dropped silently.
android.experimental.enableDeviceTargetingConfigApi=true
